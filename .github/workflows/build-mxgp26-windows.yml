name: Build MotoGrid MXGP 26 Windows installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'src/**'
      - 'supabase/**'
      - 'src-tauri/**'
      - '.env.example'
      - 'README.md'
      - '.github/workflows/build-mxgp26-windows.yml'
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install
      - name: Build installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "Missing GitHub Actions secret VITE_SUPABASE_URL. Add it in Settings > Secrets and variables > Actions."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            throw "Missing GitHub Actions secret VITE_SUPABASE_PUBLISHABLE_KEY. Add it in Settings > Secrets and variables > Actions."
          }
          npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: MotoGrid-MXGP26-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
